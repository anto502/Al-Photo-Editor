version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: "3.44.7"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  gal: ^2.3.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
